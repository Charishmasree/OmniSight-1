<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniSight Self-Healing Test Target</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #f8fafc;
      color: #0f172a;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: #ede9fe;
      color: #6d28d9;
      font-weight: 600;
      font-size: 13px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }

    .hero-title {
      font-size: 32px;
      font-weight: 800;
      color: #1e1b4b;
      margin-bottom: 12px;
    }

    /* INTENTIONAL VISUAL DEFECT: Negative margin causes subtitle to overlap primary button */
    .hero-subtitle {
      font-size: 16px;
      color: #475569;
      line-height: 1.1;
      margin-bottom: -32px; /* Visual Bug: overlaps CTA button below */
      position: relative;
      z-index: 2;
    }

    .btn-group {
      margin-top: 10px;
      display: flex;
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    .btn-primary {
      padding: 12px 28px;
      background: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary {
      padding: 12px 28px;
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .metrics-section {
      margin-top: 48px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .metric-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 20px;
    }

    .metric-value {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
    }

    .metric-label {
      font-size: 14px;
      color: #64748b;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="badge">Week 3 Self-Healing Target</span>
    <h1 class="hero-title">OmniSight Automated Visual Quality Suite</h1>
    <p class="hero-subtitle">
      Automated visual regression testing and autonomous multimodal self-healing agent pipeline.
    </p>
    <div class="btn-group">
      <button class="btn-primary" id="cta-button">Run Self-Healing</button>
      <button class="btn-secondary">View Documentation</button>
    </div>

    <div class="metrics-section">
      <div class="metric-card">
        <div class="metric-value">99.8%</div>
        <div class="metric-label">Defect Detection Rate</div>
      </div>
      <div class="metric-card">
        <div class="metric-value">3.2s</div>
        <div class="metric-label">Average Healing Loop</div>
      </div>
      <div class="metric-card">
        <div class="metric-value">0</div>
        <div class="metric-label">Breaking Changes</div>
      </div>
    </div>
  </div>
</body>
</html>
